; PlatformIO / pioarduino project for the IP Motorshield firmware.
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; The sources stay in ip-chassis-main/ip-motorshield, so the folder still opens
; in the Arduino IDE unchanged.

[platformio]
src_dir = ip-chassis-main/ip-motorshield
default_envs = ip-motorshield

[env:ip-motorshield]
; pioarduino = PlatformIO platform with Arduino-ESP32 core 3.x
; (the code uses ledcAttach(), which does not exist in core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; Same chip/settings as "ESP32S3 Dev Module" in the Arduino IDE (4 MB default flash layout)
board = esp32-s3-devkitc-1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    pololu/QTRSensors@^4.0.0
    links2004/WebSockets@^2.6.1
